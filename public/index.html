<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIVEC | Portal municipal de oferta deportiva y cultural</title>
  <link rel="stylesheet" href="/sivec.css">
  <script src="/sivec.js" defer></script>
</head>
<body class="page-grid">
  <header>
    <div class="dossier-bar">
      <span class="dossier-pill">SIVEC · Portal municipal</span>
      <nav aria-label="Secciones">
        <a href="#cronogramas">Cronogramas</a>
        <a href="#escenarios">Escenarios</a>
        <a href="#inscripciones">Inscripciones</a>
      </nav>
    </div>
    <h1 class="title">Sistema Público de Información Deportiva y Cultural</h1>
  </header>
  <main>
    <section id="cronogramas" aria-labelledby="cronogramas-titulo">
      <h2 class="section-title" id="cronogramas-titulo">Inventario público de cronogramas</h2>
      <p id="schedule-status" role="status">Cargando cronogramas…</p>
      <ul id="schedule-list" class="cards"></ul>
    </section>
    <section id="escenarios" aria-labelledby="escenarios-titulo">
      <h2 class="section-title" id="escenarios-titulo">Semáforo de escenarios deportivos</h2>
      <p id="facility-status" role="status">Cargando escenarios…</p>
      <ul id="facility-list" class="cards"></ul>
    </section>
    <section id="inscripciones" aria-labelledby="inscripciones-titulo">
      <h2 class="section-title" id="inscripciones-titulo">Inscripciones</h2>
      <div class="figure-card panel">
        <form id="login">
          <h3>Iniciar sesión</h3>
          <label>Usuario<input name="credencialesLogin" autocomplete="username" maxlength="50" required></label>
          <label>Contraseña<input name="credencialesClave" type="password" autocomplete="current-password" maxlength="256" required></label>
          <button>Ingresar</button>
        </form>
        <div id="session" hidden>
          <p id="profile"></p>
          <button type="button" class="secondary" id="logout">Cerrar sesión</button>
        </div>
        <p id="login-status" role="status"></p>
        <form id="enrollment" hidden>
          <label for="schedule">Cronograma</label>
          <select id="schedule" name="scheduleId" required disabled></select>
          <button id="enroll-button" disabled>Confirmar inscripción</button>
        </form>
        <p id="enrollment-status" role="status"></p>
      </div>
    </section>
  </main>
</body>
</html>
